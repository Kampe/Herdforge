name: Crash lab maintenance tick

on:
  push:
    branches: [ "lab/**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crash-lab-maintenance-tick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linked-root-mutation:
    name: Linked-root mutation control
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh

      - name: Mutate gitOutIn CombinedOutput and require named FAIL
        run: zsh scripts/crash-lab-gitoutin-mutation.sh

      - name: Mutate to per-worktree root and require named FAIL
        env:
          MUTATION_LOG: ${{ github.workspace }}/maintenance-root-mutation.log
        run: zsh scripts/crash-lab-maintenance-root-mutation.sh

      - name: Upload mutation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-root-mutation-${{ github.sha }}
          path: maintenance-root-mutation.log
          if-no-files-found: warn
          retention-days: 7

  shared-tick:
    name: Two linked worktrees share tick lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build linux herd
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -p 1 -o dist/herd-linux-amd64 ./cmd/herd

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh lsof

      - name: Prove shared tick lock and cursor
        env:
          HERD: ${{ github.workspace }}/dist/herd-linux-amd64
          MAINT_LAB_LOG: ${{ github.workspace }}/maint-lab.log
        run: zsh scripts/crash-lab-maintenance-tick-outer.sh

      - name: Upload sanitized lab log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maint-tick-lab-${{ github.sha }}
          path: maint-lab.log
          if-no-files-found: warn
          retention-days: 7
