name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel a superseded run: a new push to the same PR or to main cancels the
# older in-progress run for that ref instead of running both to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Build, lint, unit tests & preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh

      - name: Install landed retention tools
        run: sudo apt-get install -y --no-install-recommends jq coreutils

      # Fail cheaply before Go setup, gosec installation or the unit suite.
      # The same fixture remains required by both full landed-control drivers.
      - name: Verify landed suite retention before foundation
        shell: zsh {0}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          report_parent=.verify-landed-receipt-logs
          mkdir -p -- "$report_parent"
          run_dir=$(mktemp -d "$report_parent/foundation-XXXXXX")
          {
            for tool in git jq timeout; do
              command -v "$tool" >/dev/null || { print -u2 "error: $tool is required"; exit 1; }
            done
            timeout -k 2s 20s zsh scripts/verify-landed-suite-retention.zsh \
              scripts/lib/landed-control-suites.zsh "$run_dir/suite-retention"
          } >"$run_dir/suite-retention.log" 2>&1

      - name: Upload early landed suite retention logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-landed-suite-retention-logs
          path: .verify-landed-receipt-logs/foundation-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Set up pinned gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.10

      # Use the upstream CLI directly. The v2 action performs a GitHub user
      # lookup and turns transient API failures into a license failure before
      # the repository's deterministic security gate can run.
      - name: Set up pinned Gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 "$url" --output "$tmp_dir/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$tmp_dir/$archive" | sha256sum --check --status
          tar -xzf "$tmp_dir/$archive" -C "$tmp_dir"
          test -x "$tmp_dir/gitleaks"
          install -m 0755 "$tmp_dir/gitleaks" "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks" version

      # Pinned to setup-trivy v0.3.1. This installs the scanner consumed by
      # make lint's tracked-module HIGH/CRITICAL dependency gate.
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.74.0

      - name: Checkout Chainseer parity source
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Kampe/chainseer
          path: chainseer
          fetch-depth: 1

      - name: Report Chainseer parity availability
        run: |
          if [ -d chainseer/bin ]; then
            echo "Chainseer parity source available; FAC-309 parity gate will run."
            echo "CHAINSEER_BIN=chainseer/bin" >> "$GITHUB_ENV"
          else
            echo "Chainseer parity source unavailable to this CI token; FAC-309 parity is explicitly skipped."
            echo "CHAINSEER_PARITY_OPTIONAL=1" >> "$GITHUB_ENV"
          fi

      # Run the small orchestration controls before the expensive foundation.
      - name: Install CI fixture parser
        run: sudo apt-get install -y --no-install-recommends ruby

      - name: Verify CI dependency and collector controls
        timeout-minutes: 3
        run: ruby scripts/verify-ci-parallel.rb

      - name: Upload CI dependency and collector control logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-ci-parallel-logs
          path: .verify-ci-parallel-logs/run-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # make lint runs go vet, the hermeticity scan (FAC-215), the package
      # inventory drift check (FAC-301), and the security gates.
      - name: Build, lint, unit tests, preflight
        run: make lint test-unit test-race preflight
        env:
          CHAINSEER_BIN: chainseer/bin

  # Two fixed control jobs bound concurrency while every driver stays serial.
  controls_other:
    name: Mutation controls (remaining suites)
    runs-on: ubuntu-latest
    needs: foundation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Set up pinned gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.10

      # Use the upstream CLI directly. The v2 action performs a GitHub user
      # lookup and turns transient API failures into a license failure before
      # the repository's deterministic security gate can run.
      - name: Set up pinned Gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 "$url" --output "$tmp_dir/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$tmp_dir/$archive" | sha256sum --check --status
          tar -xzf "$tmp_dir/$archive" -C "$tmp_dir"
          test -x "$tmp_dir/gitleaks"
          install -m 0755 "$tmp_dir/gitleaks" "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks" version

      # Pinned to setup-trivy v0.3.1. This installs the scanner consumed by
      # make lint's tracked-module HIGH/CRITICAL dependency gate.
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.74.0

      - name: Checkout Chainseer parity source
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Kampe/chainseer
          path: chainseer
          fetch-depth: 1

      - name: Report Chainseer parity availability
        run: |
          if [ -d chainseer/bin ]; then
            echo "Chainseer parity source available; FAC-309 parity gate will run."
            echo "CHAINSEER_BIN=chainseer/bin" >> "$GITHUB_ENV"
          else
            echo "Chainseer parity source unavailable to this CI token; FAC-309 parity is explicitly skipped."
            echo "CHAINSEER_PARITY_OPTIONAL=1" >> "$GITHUB_ENV"
          fi

      # FAC-36: the `herd process` read path is defended almost entirely by
      # NEGATIVE assertions -- the sweep is bounded, a broken roster is not an
      # empty fleet, a transport error is not a verdict, a cut tail is not a
      # complete digest. A negative assertion that never sees its guard removed
      # proves nothing, so this step removes each one from the REAL source, in
      # its own ephemeral worktree, and requires the named test to fail on its
      # named assertion. A mutant that does not compile is BROKEN-RUN, not a
      # kill.
      #
      # Finite and explicit. The driver bounds each compile and each serial
      # package run itself; this is the outer ceiling so a wedged step cannot
      # hold a runner. Six mutants, each one compile plus one anchored run,
      # plus two package baselines and two restored runs, all serial.
      #
      # Scope, stated at its real strength: the subprocess CLI fixtures are
      # deliberately outside this driver's selectors because they build the
      # whole binary, so the step above remains the required executor for them.
      # In particular the end-to-end shared-deadline claim is carried by
      # TestProcessCLIHungPanesStopAtTheSweepDeadline in `make test-unit`, not
      # here: this driver's sweep-context control proves only the inter-pane
      # check, against an in-memory helper with the transport stubbed out.
      - name: Verify process digest guard controls
        timeout-minutes: 45
        run: |
          command -v zsh >/dev/null || { echo "zsh is required for this step"; exit 1; }
          scripts/verify-process-digest-guards.zsh

      # Same bounded retention pattern as the manifest budget controls, and the
      # same trap it fell into: .verify-process-digest-logs/ is a HIDDEN
      # directory, and upload-artifact excludes hidden paths by default, so
      # without include-hidden-files every run would upload nothing, warn
      # instead of failing, and leave a green receipt describing controls whose
      # raw output survived nowhere.
      #
      # if: always() is the point of the step -- the summary and the raw
      # `go test -json` streams are worth most precisely when the controls
      # FAILED. A missing log set is an error, not a warning: evidence that did
      # not survive must not be reportable as green.
      #
      # Bounded by construction: the driver writes one summary plus, per
      # mutant, one compile log and one focused event stream, and the selectors
      # exclude the subprocess fixtures, so the set stays small. Seven-day
      # retention, one already-controlled path, no glob broadened.
      - name: Upload process digest control logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-process-digest-logs
          path: .verify-process-digest-logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # FAC-828: the bounded inbox's limits are covered by tests that must be
      # shown to fail. Every mutant compiles first, so a compile error is never
      # counted as a kill, and the source is restored and re-proved after each.
      - name: FAC-828 bounded inbox non-vacuity controls
        timeout-minutes: 20
        run: |
          command -v zsh >/dev/null || { echo "zsh is required for this step"; exit 1; }
          scripts/verify-mail-bounds.zsh

      - name: Upload bounded inbox control logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-mail-bounds-logs
          path: .verify-bounds-logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # FAC-826: the admission guards are covered by tests that had never been
      # shown to fail. This driver mutates the real source one guard at a time,
      # proves each mutant COMPILES, then requires the named killer test to fail
      # on its named assertion, read from go test JSON. It owns one ephemeral
      # worktree under RUNNER_TEMP, removes only that, and fails if it cannot.
      - name: FAC-826 resource admission non-vacuity controls
        timeout-minutes: 45
        run: |
          command -v zsh >/dev/null || { echo "zsh is required for this step"; exit 1; }
          scripts/verify-resource-admission.zsh

      # The logs land under a HIDDEN directory, which upload-artifact excludes
      # by default; without these two settings a run would report green while
      # retaining none of the evidence it claims (FAC-827, 19b4e765).
      - name: Upload resource admission control logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-resource-admission-logs
          path: .verify-admission-logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: FAC-829 resource observer non-vacuity controls
        timeout-minutes: 25
        run: |
          command -v zsh >/dev/null || { echo "zsh is required for this step"; exit 1; }
          scripts/verify-resource-observer.zsh

      # Same hidden-directory trap as above: without these two settings the run
      # reports green while retaining none of the evidence it claims. The path is
      # restricted to run-* evidence so nothing but this driver's own logs can be
      # uploaded, whatever else ends up under the directory.
      - name: Upload resource observer control logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-resource-observer-logs
          path: .verify-observer-logs/run-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # FAC-831: the landed-proof producer is defended by bounds that only
      # matter if real work actually consults them. Each control removes one —
      # the command charge, the range cap, the entry-path allowance — and
      # requires its named test to fail on its named assertion.
      - name: Verify landed proof bounds controls
        timeout-minutes: 30
        run: |
          command -v zsh >/dev/null || { echo "zsh is required for this step"; exit 1; }
          scripts/verify-landed-proof-bounds.zsh

      - name: Upload landed proof bounds logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-landed-proof-bounds-logs
          path: .verify-landed-proof-bounds-logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # FAC-824: the mailbox-repair guards refuse stale or conflicting
      # identity, malformed unrelated rows, privileged records and concurrent
      # change, and they bound the durable prepare/recovery/completion
      # boundaries. Refusal tests alone cannot show those guards are load
      # bearing, so this step removes each one from the REAL source, in its own
      # ephemeral worktree, and requires the named test to fail on its named
      # assertion. Serial by construction: one checkout, one mutant at a time.
      # Finite and explicit. The driver bounds each compile and each serial
      # package run itself; this is the outer ceiling so a wedged step cannot
      # hold a runner indefinitely. The driver's mutations array determines
      # the count; each mutant has one compile and one anchored package run,
      # plus a baseline and a restored run, all serial.
      - name: Verify mail repair guard controls
        timeout-minutes: 30
        run: |
          command -v zsh >/dev/null || { echo "zsh is required for this step"; exit 1; }
          scripts/verify-mail-repair-guards.zsh

      # The control logs land under a HIDDEN directory, and upload-artifact
      # excludes hidden paths by default, so without this the step would
      # describe controls whose raw output was retained nowhere. A missing log
      # set FAILS: evidence that did not survive must not be reportable as
      # green.
      - name: Upload mail repair guard control logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-mail-repair-guard-logs
          path: .verify-mail-repair-logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # FAC-827: the budget guards are covered by tests that had never been
      # shown to fail. This driver proves each mutant COMPILES and then dies on
      # a named assertion, read from go test JSON, so the receipt cannot claim
      # controls that never ran. It owns one ephemeral worktree under
      # RUNNER_TEMP, removes only that, and fails the step if it cannot.
      - name: FAC-827 manifest budget non-vacuity controls
        timeout-minutes: 25
        run: |
          command -v zsh >/dev/null || { echo "zsh is required for this step"; exit 1; }
          scripts/verify-manifest-budget.zsh

      # The control logs land under a HIDDEN directory, and upload-artifact
      # excludes hidden paths by default, so every run uploaded nothing and
      # warned about it. The receipt then described controls whose raw output
      # was not retained anywhere. Hidden files are included explicitly for
      # this one controlled path, and a missing log set now FAILS the step:
      # evidence that did not survive must not be reportable as green.
      - name: Upload manifest budget control logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-manifest-budget-logs
          path: .verify-budget-logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # FAC-825: the registered census's bounded rotating window exists because
      # one expensive lane could consume the whole registered phase before any
      # lane qualified. Its tests pass, which says nothing about whether they
      # would notice the window being removed, so this driver removes each guard
      # from the real source and requires the named oracle to die on its named
      # assertion. Serial: one package, one mutant at a time.
      - name: FAC-825 census window non-vacuity controls
        timeout-minutes: 25
        run: |
          command -v zsh >/dev/null || { echo "zsh is required for this step"; exit 1; }
          scripts/verify-census-window.zsh

      # Hidden directory again: without these settings the run reports green
      # while retaining none of the evidence it claims. Restricted to run-*, so
      # only this driver's own logs are uploaded.
      - name: Upload census window control logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-census-window-logs
          path: .verify-census-logs/run-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # FAC-832: review preparation allocated a detached carrier under
      # .herd/worktrees on every resolution, including when the caller had
      # already pinned both the exact candidate sha and the exact base. Nothing
      # read that directory — the reviewer works in the leased pool slot — and
      # --no-launch records no manifest, so it outlived its reviewer with no
      # retirement owner. This driver removes the allocation guard and requires
      # the named oracle to die on its named assertion.
      - name: FAC-832 review carrier allocation controls
        timeout-minutes: 25
        run: |
          command -v zsh >/dev/null || { echo "zsh is required for this step"; exit 1; }
          scripts/verify-review-carrier.zsh

      - name: Upload review carrier control logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-review-carrier-logs
          path: .verify-review-carrier-logs/run-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # FAC-764: `herd pool release` from the orchestrator's working directory
      # failed with "cannot change to '.herd/pool/pool-01'" while the identical
      # release from the canonical checkout succeeded. The stored slot path is
      # deliberately repository-relative, and ordinary Release handed it to
      # `git -C`, which resolves against the CALLER's working directory — so
      # wherever that relative path existed under the caller, the wrong tree was
      # reset. This driver removes each anchoring and ownership guard from the
      # real source and requires the named oracle to die on its named assertion.
      - name: FAC-764 pool owning-root anchoring controls
        timeout-minutes: 25
        run: |
          command -v zsh >/dev/null || { echo "zsh is required for this step"; exit 1; }
          scripts/verify-pool-owning-root.zsh

      # Hidden directory: without these settings the run reports green while
      # retaining none of the baseline, compile, mutant or restored evidence it
      # claims. Restricted to run-*, so only this driver's own logs upload.
      - name: Upload pool owning-root control logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-pool-owning-root-logs
          path: .verify-pool-owning-root-logs/run-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # FAC-613: a lifecycle refusal used to arrive with no way to tell which
      # census phase spent the budget — the sweep built a report with per-stage
      # timings and counts and the refusal path discarded it. This driver
      # removes each new guard (error identity, success untouched, no raw text
      # in the summary) and requires the named oracle to die on its named
      # assertion.
      - name: FAC-613 lifecycle refusal diagnostics controls
        timeout-minutes: 20
        run: |
          command -v zsh >/dev/null || { echo "zsh is required for this step"; exit 1; }
          scripts/verify-lifecycle-diagnostics.zsh

      - name: Upload lifecycle diagnostics control logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-lifecycle-diagnostics-logs
          path: .verify-lifecycle-diagnostics-logs/run-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # FAC-830: the cross-process single-flight test failed on main under one
      # specific shuffle order. This replays that exact seed a bounded number of
      # times, so an order- or contention-sensitive test fails here rather than
      # on somebody else's PR, and then removes each single-flight guard to prove
      # the test can actually see it.
      - name: FAC-830 quota single-flight determinism and controls
        timeout-minutes: 20
        run: |
          command -v zsh >/dev/null || { echo "zsh is required for this step"; exit 1; }
          scripts/verify-quota-singleflight.zsh

      # Hidden directory again: without these settings the run is green while
      # retaining none of the evidence it claims.
      - name: Upload quota single-flight control logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-quota-singleflight-logs
          path: .verify-singleflight-logs/run-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: FAC-818 stale quota error control
        timeout-minutes: 25
        run: zsh scripts/verify-stale-quota-error.zsh

      - name: Upload stale quota error control logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-stale-quota-error-logs
          path: .verify-stale-quota-logs/run-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  controls_receipt:
    name: Mutation controls (landed receipts)
    runs-on: ubuntu-latest
    needs: foundation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Set up pinned gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.10

      # Use the upstream CLI directly. The v2 action performs a GitHub user
      # lookup and turns transient API failures into a license failure before
      # the repository's deterministic security gate can run.
      - name: Set up pinned Gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 "$url" --output "$tmp_dir/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$tmp_dir/$archive" | sha256sum --check --status
          tar -xzf "$tmp_dir/$archive" -C "$tmp_dir"
          test -x "$tmp_dir/gitleaks"
          install -m 0755 "$tmp_dir/gitleaks" "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks" version

      # Pinned to setup-trivy v0.3.1. This installs the scanner consumed by
      # make lint's tracked-module HIGH/CRITICAL dependency gate.
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.74.0

      - name: Checkout Chainseer parity source
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Kampe/chainseer
          path: chainseer
          fetch-depth: 1

      - name: Report Chainseer parity availability
        run: |
          if [ -d chainseer/bin ]; then
            echo "Chainseer parity source available; FAC-309 parity gate will run."
            echo "CHAINSEER_BIN=chainseer/bin" >> "$GITHUB_ENV"
          else
            echo "Chainseer parity source unavailable to this CI token; FAC-309 parity is explicitly skipped."
            echo "CHAINSEER_PARITY_OPTIONAL=1" >> "$GITHUB_ENV"
          fi

      # FAC-831: the landed-receipt producer is defended by NEGATIVE assertions
      # -- it must not seal a patch carrier as MergeSHA, must not reach for a
      # later commit that merely contains the base, and must not observe a
      # landing against the invoking checkout without a pinned candidate. Each
      # is removed from the REAL source here and its named test must fail on its
      # named assertion; a mutant that does not build is BROKEN-RUN, not a kill.
      #
      # Serial by construction: one ephemeral checkout, one mutant at a time,
      # each a compile plus one anchored package run, plus a baseline and a
      # restored run. The mutant COUNT is deliberately not written here: two
      # authors change this driver independently, and a number in a comment goes
      # stale silently. The driver's own mutations array is the count.
      - name: Verify landed receipt guard controls
        timeout-minutes: 30
        run: |
          command -v zsh >/dev/null || { echo "zsh is required for this step"; exit 1; }
          scripts/verify-landed-receipt-guards.zsh

      # Bounded raw retention, same pattern as the other control steps. The log
      # directory is HIDDEN, so include-hidden-files is required or the upload
      # silently matches nothing; a missing log set is an error, not a warning,
      # because evidence that did not survive must not read as green; and
      # if: always() keeps the logs from the failing runs that need them most.
      - name: Upload landed receipt control logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-landed-receipt-logs
          path: .verify-landed-receipt-logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Keep the merge policy's required check name. always() also schedules this
  # collector when a failed foundation caused both control jobs to be skipped.
  # Only three explicit success results can produce a successful required gate.
  gate:
    name: Build, Preflight & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [foundation, controls_other, controls_receipt]
    steps:
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh

      - name: Require foundation and both control lanes
        shell: zsh {0}
        env:
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
          OTHER_CONTROLS_RESULT: ${{ needs.controls_other.result }}
          RECEIPT_CONTROLS_RESULT: ${{ needs.controls_receipt.result }}
        run: |
          set -euo pipefail
          for required_job in \
            "foundation:${FOUNDATION_RESULT-}" \
            "controls_other:${OTHER_CONTROLS_RESULT-}" \
            "controls_receipt:${RECEIPT_CONTROLS_RESULT-}"
          do
            if [[ "${required_job#*:}" != success ]]; then
              echo "Required CI job did not succeed: $required_job" >&2
              exit 1 # FAC-833 refusal
            fi
          done

  # FAC-198: the quarantined ownership suite only runs inside the hermetic
  # Docker profile. Compile is already part of test-unit; this job is the
  # reachable executor so those tests are not "compile-only forever."
  fac151-hermetic:
    name: FAC-151 hermetic (Docker)
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run hermetic FAC-151 profile
        run: make test-hermetic-fac151

  coverage:
    name: Coverage (authoritative, main only)
    runs-on: ubuntu-latest
    # PR already ran the gate; only the merged main commit runs coverage, so a
    # PR is the fast gate and main is the authoritative gate + coverage.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Declared test prerequisite: the FAC773 relay tests execute the real
      # scripts/fac773-mail-relay.zsh through zsh. Coverage must run them for
      # real, so coverage installs the same prerequisite the gate installs.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Coverage Report
        run: make test-coverage
