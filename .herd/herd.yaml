version: "1"

project:
  name: "Herdforge"
  default_branch: "main"

task_provider:
  type: "memory"
  project_id: "herdforge-local"

model_providers:
  - name: "claude-pro"
    type: "anthropic"
    model: "claude-3-5-sonnet"

roles:
  - name: "worker"
    provider: "claude-pro"
    prompt_path: ".herd/prompts/worker.md"

verification:
  test_command: "make lint all"
