version: "1"

# Herdforge — the forge that forges itself
project:
  name: "Herdforge"
  default_branch: "main"
  repo_url: "https://github.com/Kampe/Herdforge.git"

# Kaneo Kanban Board (Kluster local deployment)
task_provider:
  type: "kaneo"
  workspace_id: "2FeaTZjdSJDSvUVWeiKH0uKNGBhwLEld"
  project_id: "b939c5jzixruza3vvywrg1hs"
  api_url: "https://kanban-api.kampe.kluster"
  api_key_env: "KANEO_API_KEY"
  use_cli: true

# The forge fleet — three forge-themed roles. Soft model pins below are
# roster defaults only. FAC-142 SurfaceRouter.Decide owns the live
# provider/model/effort/pool for every worker and reviewer launch; FAC-139
# enforces that LaunchDecision at the tab boundary. Never pair flash
# authors with a same-family reviewer or frontier-high re-review by default.
lanes:
  # scout — surveys the board: ranks claimable tickets and grooms bare cards
  # into dispatch-ready specs, feeding the forge loop what to forge next.
  - name: "scout"
    role: "forge-smith"
    agent_kind: "opencode"
    harness: "opencode"
    prompt: ".herd/prompts/smith.md"
    worktree: ".worktrees/scout"
    provider: "lazer"
    # deepseek-v4 only (non-v4 forbidden). Probe-gated write surface.
    model: "litellm/lazer/deepseek-v4-flash"
    fallback_models:
      - "opencode/deepseek-v4-flash-free"

  # smith — forges the code at the anvil. The forge loop dispatches one builder
  # per card (task-fac-<ref>) using router LaunchDecision, not harness defaults.
  - name: "smith"
    role: "worker"
    agent_kind: "opencode"
    harness: "opencode"
    prompt: ".herd/prompts/worker.md"
    worktree: ".worktrees/smith"
    provider: "lazer"
    model: "litellm/lazer/deepseek-v4-flash"
    fallback_models:
      - "opencode/deepseek-v4-flash-free"

  # assayer — independent review. Soft default is a DIFFERENT family from the
  # deepseek flash smiths (anthropic). Effort is always router-owned: medium
  # by default; high only for final-pass/critical R2/R3 (FAC-142).
  - name: "assayer"
    role: "reviewer"
    agent_kind: "claude"
    harness: "claude"
    prompt: ".herd/prompts/reviewer.md"
    worktree: ".worktrees/assayer"
    provider: "claude"
    model: "claude-sonnet-5"
    fallback_models:
      - "grok-4.5"

# Project Verification Suite
verification:
  test_command: "go test ./..."
  preflight_command: "go build ./..."
