version: "1"

# Herdforge — the forge that forges itself
project:
  name: "Herdforge"
  default_branch: "main"
  repo_url: "https://github.com/Kampe/Herdforge.git"

# Kaneo Kanban Board (Kluster local deployment)
task_provider:
  type: "kaneo"
  workspace_id: "2FeaTZjdSJDSvUVWeiKH0uKNGBhwLEld"
  project_id: "b939c5jzixruza3vvywrg1hs"
  api_url: "https://kanban-api.kampe.kluster"
  api_key_env: "KANEO_API_KEY"
  use_cli: true

# Agent lanes — each lane is a herdr workspace tab running one agent
# All lanes default to deepseek-v4-flash via opencode for cheap self-forging
lanes:
  - name: "forge-smith"
    role: "forge-smith"
    agent_kind: "opencode"
    harness: "opencode"
    prompt: ".herd/prompts/smith.md"
    worktree: ".worktrees/smith"
    provider: "deepseek"
    model: "opencode/deepseek-v4-flash-free"

  - name: "worker"
    role: "worker"
    agent_kind: "opencode"
    harness: "opencode"
    prompt: ".herd/prompts/worker.md"
    worktree: ".worktrees/worker"
    provider: "deepseek"
    model: "opencode/deepseek-v4-flash-free"

  - name: "reviewer"
    role: "reviewer"
    agent_kind: "opencode"
    harness: "opencode"
    prompt: ".herd/prompts/reviewer.md"
    worktree: ".worktrees/reviewer"
    provider: "deepseek"
    model: "opencode/deepseek-v4-flash-free"

# Project Verification Suite
verification:
  test_command: "go test ./..."
  preflight_command: "go build ./..."
