version: "1"

# Herdforge — the forge that forges itself
project:
  name: "Herdforge"
  default_branch: "main"
  repo_url: "https://github.com/Kampe/Herdforge.git"

# Kaneo FAC Project (Herdforge)
# FAC-155: `enabled` is this repository's explicit activation policy. The
# factory activates `type` only if it is listed here; jira, azure, github
# issues, linear and memory adapters stay compiled but dormant and can never be
# auto-detected, probed, or selected. Flipping `type` without moving this list
# fails closed before any board read or mutation.
task_provider:
  type: "kaneo"
  enabled: ["kaneo"]
  project_id: "b939c5jzixruza3vvywrg1hs"

# Autonomous merge admission contract. This is intentionally in the live
# profile so provider, fleet, and merge settings change as one reviewed unit.
# Admission binds remote-CI evidence to a content revision of this section.
merge_policy:
  protected: true
  required_checks:
    - "Build, Preflight & Test Suite"
  require_different_family_review: true
  require_pull_request_reviews: true
  remote_ci:
    required: true
    required_checks:
      - "Build, Preflight & Test Suite"

# FAC-245: every admitted task worktree gets an isolated Go module/build cache
# keyed by the resolved Go toolchain. The receipt is durable and idempotent;
# a changed toolchain or declaration repairs stale per-worktree artifacts
# before a worker can start. argv is intentional: no shell profile or
# expansion is part of this repository contract.
worktree_bootstrap:
  version: "v1"
  toolchain: "go"
  command: ["go", "mod", "download"]

# The forge fleet — the complete role roster (FAC-127). Soft model pins below
# are roster defaults only. FAC-142 SurfaceRouter.Decide owns the live
# provider/model/effort/pool for every worker and reviewer launch; FAC-139
# enforces that LaunchDecision at the tab boundary. Never pair flash
# authors with a same-family reviewer or frontier-high re-review by default.
#
# Every lane below declares standing (control-plane, raised by `herd
# standing`) vs ephemeral (task role, launched per dispatch), authority
# (read|write), capabilities (probe-gated tool/network requirements), and
# incompatible_with (role labels this lane must never double as). No lane
# defaults to the shared checkout — each has its own worktree.
#
# SCOPE: authority/capabilities/incompatible_with are DECLARATIVE metadata
# (FAC-127) — a registry contract, not a launch-time gate. Nothing in this
# repo yet blocks a launch that violates them. FAC-139 ("routed launch
# enforcement") owns the executable launch-boundary API that must read
# these fields and enforce probe-gated capabilities, family separation,
# and single-owner integration at the moment a lane spawns.
#
# .herd/prompts/critical-wave-coordinator.md is a one-off wave-specific
# template (FAC-119..122 coordination), not a standing role contract; it is
# intentionally NOT registered as a lane here.
lanes:
  # scout — surveys the board: ranks claimable tickets and grooms bare cards
  # into dispatch-ready specs, feeding the forge loop what to forge next.
  - name: "scout"
    role: "forge-smith"
    agent_kind: "codex"
    harness: "codex"
    prompt: ".herd/prompts/smith.md"
    worktree: ".worktrees/scout"
    provider: "codex"
    model: "gpt-5.6-luna"
    effort: "medium"
    task_shape: "implementation"
    standing: false
    authority: "write"
    capabilities: ["git-write", "fs-write", "shell-exec"]
    incompatible_with: ["reviewer"]

  # smith — forges the code at the anvil. The forge loop dispatches one builder
  # per card (task-fac-<ref>) using router LaunchDecision, not harness defaults.
  - name: "smith"
    role: "worker"
    agent_kind: "codex"
    harness: "codex"
    prompt: ".herd/prompts/worker.md"
    worktree: ".worktrees/smith"
    provider: "codex"
    model: "gpt-5.6-luna"
    effort: "medium"
    task_shape: "implementation"
    standing: false
    authority: "write"
    capabilities: ["git-write", "fs-write", "shell-exec"]
    incompatible_with: ["reviewer"]

  # assayer — independent review. Reviewer independence is enforced from
  # candidate provenance. Worker/forge lanes use the Codex harness with the
  # explicit Codex/Luna/medium route; review effort is medium by default and high only
  # for final-pass/critical R2/R3 work (FAC-142).
  - name: "assayer"
    role: "reviewer"
    agent_kind: "claude"
    harness: "claude"
    prompt: ".herd/prompts/reviewer.md"
    worktree: ".worktrees/assayer"
    provider: "claude"
    model: "claude-sonnet-5"
    effort: "medium"
    task_shape: "qa"
    fallback_models:
      - "grok-4.5"
    standing: false
    authority: "read"
    capabilities: ["network"]
    incompatible_with: ["worker", "forge-smith", "harvest"]

  # orchestrator — fleet coordinator. Routes evidence and capacity; never
  # implements, reviews, or merges a candidate itself (.herd/prompts/orchestrator.md).
  - name: "orchestrator"
    role: "orchestrator"
    agent_kind: "claude"
    harness: "claude"
    prompt: ".herd/prompts/orchestrator.md"
    worktree: ".worktrees/orchestrator"
    provider: "claude"
    model: "claude-opus-5"
    effort: "medium"
    task_shape: "coordinator"
    standing: true
    authority: "read"
    capabilities: ["board-write", "network"]
    incompatible_with: ["worker", "forge-smith", "reviewer", "harvest"]

  # scout-planner — read-mostly queue groomer. Proposes risk tier, role,
  # dependencies, and dispatch rank; never claims or implements work itself
  # (.herd/prompts/scout-planner.md).
  - name: "scout-planner"
    role: "scout-planner"
    agent_kind: "claude"
    harness: "claude"
    prompt: ".herd/prompts/scout-planner.md"
    worktree: ".worktrees/scout-planner"
    provider: "claude"
    model: "claude-opus-5"
    effort: "medium"
    task_shape: "architecture"
    standing: true
    authority: "read"
    capabilities: ["board-write", "network"]
    incompatible_with: ["worker", "forge-smith", "reviewer", "harvest"]

  # verification-gate — deterministic verifier for one immutable candidate
  # SHA. Attests evidence; never repairs the candidate or issues a review
  # verdict (.herd/prompts/verification-gate.md).
  # verification-gate previously named opencode, which is NOT in the `bounded`
  # waterfall in either this port or chainseer's bin/herd-route — so its
  # configured surface was unreachable and every launch silently landed
  # elsewhere. claude/claude-haiku-4-5 is the real bounded claude model.
  - name: "verification-gate"
    role: "verification-gate"
    agent_kind: "claude"
    harness: "claude"
    prompt: ".herd/prompts/verification-gate.md"
    worktree: ".worktrees/verification-gate"
    provider: "claude"
    model: "claude-haiku-4-5"
    effort: "medium"
    task_shape: "bounded"
    standing: false
    authority: "read"
    capabilities: ["shell-exec"]
    incompatible_with: ["worker", "forge-smith"]

  # review-supervisor — owns review-queue flow, not verdicts. Routes
  # candidates through the verification gate and independent review into
  # the single integration queue (.herd/prompts/review-supervisor.md).
  - name: "review-supervisor"
    role: "review-supervisor"
    agent_kind: "claude"
    harness: "claude"
    prompt: ".herd/prompts/review-supervisor.md"
    worktree: ".worktrees/review-supervisor"
    provider: "claude"
    model: "claude-sonnet-5"
    effort: "medium"
    task_shape: "coordinator"
    standing: true
    authority: "read"
    capabilities: ["board-write"]
    incompatible_with: ["worker", "forge-smith", "harvest"]

  # harvest — the single-writer integration owner. Serializes reviewed
  # candidates onto the default branch (.herd/prompts/harvest.md). Single
  # standing owner enforced by config validation (duplicate standing role
  # rejected).
  - name: "harvest"
    role: "harvest"
    agent_kind: "claude"
    harness: "claude"
    prompt: ".herd/prompts/harvest.md"
    worktree: ".worktrees/harvest"
    provider: "claude"
    model: "claude-sonnet-5"
    effort: "medium"
    task_shape: "bounded"
    standing: true
    authority: "write"
    capabilities: ["git-write", "board-write"]
    incompatible_with: ["worker", "forge-smith", "reviewer"]

  # recovery-sentinel — evidence-driven fleet recovery. Detects stranded
  # work and restores a safe state without guessing success or destroying
  # unique work (.herd/prompts/recovery-sentinel.md).
  - name: "recovery-sentinel"
    role: "recovery-sentinel"
    agent_kind: "claude"
    harness: "claude"
    prompt: ".herd/prompts/recovery-sentinel.md"
    worktree: ".worktrees/recovery-sentinel"
    provider: "claude"
    model: "claude-sonnet-5"
    effort: "medium"
    task_shape: "bounded"
    standing: true
    authority: "read"
    capabilities: ["board-write", "network"]
    incompatible_with: ["worker", "forge-smith"]

  # mender — standing. Fixes the forge itself: the gates, evidence checks
  # and lifecycle bugs that cost the fleet whole sessions (FAC-211..218). Carries
  # role "recovery" because that is the only authoring role the canonical lane
  # registry has left free — one lane per role is enforced, so a third standing
  # improvement lane is blocked until that invariant is lifted. That is a real
  # limit, not an oversight; see the note under lanes.
  - name: "mender"
    role: "recovery"
    agent_kind: "codex"
    harness: "codex"
    prompt: ".herd/prompts/mender.md"
    worktree: ".worktrees/mender"
    provider: "codex"
    model: "gpt-5.6-luna"
    effort: "medium"
    task_shape: "implementation"
    standing: true
    authority: "write"
    capabilities: ["git-write", "fs-write", "shell-exec", "board-write"]
    incompatible_with: ["reviewer", "harvest"]

# LANE CAPACITY NOTE — why there is only ONE new standing lane, not a roster
# Two independent limits, both enforced at launch, not just declared:
#
#   1. CanonicalLaneRegistry allows one lane per ROLE, so Resolve() can accept a
#      lane name or a role name unambiguously.
#   2. validateLaneLaunchConfig (cmd/herd/main.go) accepts eleven roles and
#      pins each to one task_shape; worker/forge-smith/recovery must be exactly
#      codex + codex/gpt-5.6-luna/medium.
#
# CORRECTION (2026-08-08): an earlier version of this note claimed the map held
# only ten roles and that "assayer" was not among them, so no role was left for
# another standing lane — and a written ci-warden lane was withdrawn on that
# basis. That was wrong. The map at cmd/herd/main.go:4687 contains eleven
# entries including launch.AssayerRole ("assayer", task_shape "qa"), and
# launch.go:913 accepts it alongside orchestrator/reviewer/scout-planner. Ten of
# the eleven roles are taken by the lanes above; "assayer" is free, so one more
# standing lane may legally be added carrying role "assayer" with
# task_shape "qa". Verify against the map before relying on this either way.
# The lane is named "mender", not "forge-mender": live agent ids are prefixed
# forge-<lane>, and a lane whose own name starts with forge- is unselectable
# ("unknown standing selection \"mender\"" when the prefix is stripped).
#
# Chainseer runs a dozen domain lanes (api-crusader, security-sentinel,
# perf-cost-guard, docs-custodian, qa-sentinel, coverage-integrity, ux-comber...)
# because it is not bound by this registry. Herdforge cannot match that roster
# until roles may own several lanes.

# Project Verification Suite
verification:
  test_command: "go test ./..."
  preflight_command: "go build ./..."
